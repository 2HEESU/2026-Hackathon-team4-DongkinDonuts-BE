name: Deploy to Gabia Cloud

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: gabia-production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"

jobs:
  verify:
    name: Verify Django project
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: github-actions-secret-key
      DEBUG: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to Gabia server
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    env:
      SSH_HOST: ${{ secrets.GABIA_HOST }}
      SSH_USER: ${{ secrets.GABIA_USER }}
      SSH_PORT: ${{ secrets.GABIA_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.GABIA_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.GABIA_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.GABIA_DEPLOY_PATH }}
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
      PYTHON_BIN: ${{ secrets.GABIA_PYTHON_BIN || 'python3' }}
      VENV_PATH: ${{ secrets.GABIA_VENV_PATH }}
      SERVICE_NAME: ${{ secrets.GABIA_SERVICE_NAME }}
      RESTART_COMMAND: ${{ secrets.GABIA_RESTART_COMMAND }}
      HEALTHCHECK_URL: ${{ secrets.GABIA_HEALTHCHECK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_PATH"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/gabia_deploy_key
          chmod 600 ~/.ssh/gabia_deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Run remote deployment
        run: |
          remote_env=$(printf \
            'DEPLOY_PATH=%q DEPLOY_REF=%q PYTHON_BIN=%q VENV_PATH=%q SERVICE_NAME=%q RESTART_COMMAND=%q HEALTHCHECK_URL=%q bash -s' \
            "$DEPLOY_PATH" \
            "$DEPLOY_REF" \
            "$PYTHON_BIN" \
            "$VENV_PATH" \
            "$SERVICE_NAME" \
            "$RESTART_COMMAND" \
            "$HEALTHCHECK_URL")

          ssh -i ~/.ssh/gabia_deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "$remote_env" < scripts/deploy.sh
